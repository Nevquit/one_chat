[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wanchain-agent"
version = "0.1.0"
description = "Wanchain 跨链与知识问答智能体"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "langgraph==1.2.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "mypy>=1.10,<2",
    "ruff>=0.5,<1",
]
eval = [
    "deepeval>=1.0",
    "ragas>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
