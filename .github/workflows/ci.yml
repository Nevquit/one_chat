name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 单元测试
        run: python -m pytest tests/unit -q

      # 规则模式零 token 成本；指标低于门禁时 router_eval 以非零码退出
      - name: 路由规则门禁
        run: python -m evaluation.router_eval --mode rules
